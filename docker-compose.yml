services:
  postgres:
    image: postgres:16-alpine
    container_name: clfr_postgres
    environment:
      POSTGRES_USER: clfr
      POSTGRES_PASSWORD: clfr_local_password
      POSTGRES_DB: campus_lost_found
    ports:
      - "5433:5432"
    volumes:
      - clfr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clfr -d campus_lost_found"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clfr_postgres_data:
