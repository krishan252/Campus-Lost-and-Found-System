# Production deployment template. Requires TLS reverse proxy and environment files.
# Run from repo root: docker compose --env-file deploy/.env.production -f deploy/compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unitrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_DB: unitrace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unitrace -d unitrace"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  api:
    image: ghcr.io/${GHCR_REPO:?Set lowercase owner/repo in deploy/.env.production}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./server.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      FILE_UPLOAD_DIR: /app/uploads
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/index.js"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks: [internal]

  web:
    image: ghcr.io/${GHCR_REPO:?Set lowercase owner/repo in deploy/.env.production}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  uploads_data:
