name: UniTrace CD - publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clfr_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: unitrace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clfr_ci -d unitrace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://clfr_ci:ci_only_password@127.0.0.1:5432/unitrace_ci?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production-at-least-32-characters
      CLIENT_URL: http://localhost:5173
      ALLOWED_EMAIL_DOMAINS: engug.ruh.ac.lk,ruh.ac.lk
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix client ci
      - name: Generate Prisma client and test migrations
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  publish:
    name: Publish ${{ matrix.service }} image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: server/Dockerfile
          - service: web
            dockerfile: client/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          repo_lc="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo_lc}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned + latest images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
